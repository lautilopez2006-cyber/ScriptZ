# Builds ScriptlZ for Windows, macOS and Linux on every tag (v*) and on manual runs.
name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: '' }
          - { os: macos-latest, args: '--target universal-apple-darwin' }
          - { os: ubuntu-22.04, args: '' }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}" }
      - if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm install --no-audit --no-fund
      - run: npm run build:server
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - uses: tauri-apps/tauri-action@v0
        with:
          tagName: v__VERSION__
          releaseName: 'ScriptlZ __VERSION__'
          releaseDraft: true
          args: ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Microsoft Store package. Set the repository variables MSIX_IDENTITY_NAME, MSIX_PUBLISHER and
      # MSIX_PUBLISHER_DISPLAY_NAME to the values shown in Partner Center → Product identity.
      - if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          ./src-tauri/msix/build-msix.ps1 -Version $version -IdentityName "$env:MSIX_IDENTITY_NAME" -Publisher "$env:MSIX_PUBLISHER" -PublisherDisplayName "$env:MSIX_PUBLISHER_DISPLAY_NAME"
      - if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Attach the MSIX to the draft release created by tauri-action (drafts have no tag yet, so look it up by name).
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $rel = (Invoke-RestMethod -Headers $headers "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases?per_page=20") | Where-Object { $_.tag_name -eq "v$version" } | Select-Object -First 1
          if (-not $rel) { Write-Warning 'No hay release borrador para adjuntar el MSIX'; exit 0 }
          $name = Split-Path $env:MSIX_PATH -Leaf
          $old = $rel.assets | Where-Object { $_.name -eq $name }
          if ($old) { Invoke-RestMethod -Method Delete -Headers $headers $old.url | Out-Null }
          Invoke-RestMethod -Method Post -Headers ($headers + @{ 'Content-Type' = 'application/octet-stream' }) -InFile $env:MSIX_PATH "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($rel.id)/assets?name=$name" | Out-Null
          Write-Host "Adjuntado $name"
      - uses: actions/upload-artifact@v4
        with:
          name: scriptz-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/msix/*.msix
  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build && npm run build:server
      - uses: actions/upload-artifact@v4
        with: { name: scriptz-web, path: dist }
      - uses: actions/upload-artifact@v4
        with: { name: scriptz-collab-server, path: server/collab-server.mjs }
